name: repost-bot

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"     # GitHub may start runs a few minutes late
  workflow_dispatch:
    inputs:
      best_now:
        description: "Send this many top-performing reels right away (0 = no)"
        default: "0"

concurrency:
  group: repost-bot
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        run: |
          mkdir -p data
          if git fetch --depth 1 origin state; then
            git show FETCH_HEAD:state.db > data/state.db && echo "state restored" || rm -f data/state.db
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          PKGS="ffmpeg tesseract-ocr tesseract-ocr-eng"
          sudo timeout 300 apt-get install -y -qq --no-install-recommends $PKGS >/dev/null 2>&1 \
            || (sudo timeout 600 apt-get update -qq -o Acquire::Retries=2 && sudo apt-get install -y -qq --no-install-recommends $PKGS >/dev/null)
          pip install -q -r requirements.txt

      - name: Run bot (about 9 minutes)
        env:
          HN_ACCESS_TOKEN: ${{ secrets.HN_ACCESS_TOKEN }}
          HN_TELEGRAM_TOKEN: ${{ secrets.HN_TELEGRAM_TOKEN }}
          HN_SPARE_IG_USERNAME: ${{ secrets.HN_SPARE_IG_USERNAME }}
          HN_IG_SESSION_B64: ${{ secrets.HN_IG_SESSION_B64 }}
          HN_IG_COOKIES_B64: ${{ secrets.HN_IG_COOKIES_B64 }}
          HN_PROXY: ${{ secrets.HN_PROXY }}
          GH_TOKEN: ${{ github.token }}
        run: python hn_repost.py --run-minutes 9 --best-now "${{ github.event.inputs.best_now || 0 }}"

      - name: Save state
        if: always()
        run: |
          [ -f data/state.db ] || exit 0
          cd "$(mktemp -d)"
          git init -q && git checkout -q -b state
          cp "$GITHUB_WORKSPACE/data/state.db" .
          git add state.db
          git -c user.name=hn-bot -c user.email=hn-bot@users.noreply.github.com commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" state

      - name: Queue next run (keeps the bot running between scheduled runs)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run bot.yml -R "${{ github.repository }}" --ref main || true
