name: repost-bot

on:
  schedule:
    - cron: "*/10 * * * *"     # GitHub may start runs a few minutes late
  workflow_dispatch:

concurrency:
  group: repost-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Restore state
        run: |
          mkdir -p data
          if git fetch --depth 1 origin state 2>/dev/null; then
            git show origin/state:state.db > data/state.db || true
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          pip install -q -r requirements.txt

      - name: Run bot (about 9 minutes)
        env:
          HN_ACCESS_TOKEN: ${{ secrets.HN_ACCESS_TOKEN }}
          HN_TELEGRAM_TOKEN: ${{ secrets.HN_TELEGRAM_TOKEN }}
          HN_SPARE_IG_USERNAME: ${{ secrets.HN_SPARE_IG_USERNAME }}
          HN_IG_SESSION_B64: ${{ secrets.HN_IG_SESSION_B64 }}
          HN_PROXY: ${{ secrets.HN_PROXY }}
        run: python hn_repost.py --run-minutes 9

      - name: Save state
        if: always()
        run: |
          [ -f data/state.db ] || exit 0
          cd "$(mktemp -d)"
          git init -q && git checkout -q -b state
          cp "$GITHUB_WORKSPACE/data/state.db" .
          git add state.db
          git -c user.name=hn-bot -c user.email=hn-bot@users.noreply.github.com commit -qm "state $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" state
