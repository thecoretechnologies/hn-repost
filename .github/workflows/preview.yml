name: logo-preview
on:
  push:
    branches: [preview-job]
    paths: [request.txt]
permissions:
  contents: write
jobs:
  make:
    runs-on: ubuntu-latest
    env:
      HN_ACCESS_TOKEN: ${{ secrets.HN_ACCESS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Build previews
        run: |
          set +e
          {
            git fetch --depth 1 origin state && git show FETCH_HEAD:state.db > state.db
            sudo apt-get install -y -qq ffmpeg >/dev/null 2>&1
            pip install -q requests
            pip install -q -r requirements.txt 2>/dev/null || pip install -q requests Pillow
            sudo apt-get install -y -qq tesseract-ocr >/dev/null 2>&1; pip install -q pytesseract; python ocr_probe.py
          } > out_log.txt 2>&1
          echo "exit $?" >> out_log.txt
          true
      - name: Save results
        run: |
          mkdir -p out && mv out_log.txt out/
          git add out
          git -c user.name=hn-bot -c user.email=hn-bot@users.noreply.github.com commit -qm "logo previews"
          git push -q origin preview-job
